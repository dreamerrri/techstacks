const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 0, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(400, 400);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 3);
dirLight.position.set(10, 10, 10);
scene.add(dirLight);

// Decode GLTF
const gltfBytes = atob(GLTF_B64);
const gltfJson = JSON.parse(gltfBytes);

// Decode embedded buffer
const bufUri = gltfJson.buffers[0].uri;
const bufB64 = bufUri.split(',')[1];
const bufBytes = atob(bufB64);
const bufArray = new Uint8Array(bufBytes.length);
for (let i = 0; i < bufBytes.length; i++) bufArray[i] = bufBytes.charCodeAt(i);

const bufferViews = gltfJson.bufferViews;

function getBufferView(idx) {
  const bv = bufferViews[idx];
  return bufArray.buffer.slice(bv.byteOffset, bv.byteOffset + bv.byteLength);
}

function getAccessorData(accessors, idx) {
  const acc = accessors[idx];
  const bv = bufferViews[acc.bufferView];
  const offset = (acc.byteOffset || 0);
  const raw = bufArray.buffer.slice(bv.byteOffset + offset, bv.byteOffset + bv.byteLength);
  if (acc.componentType === 5126) return new Float32Array(raw);
  if (acc.componentType === 5123) return new Uint16Array(raw);
  if (acc.componentType === 5125) return new Uint32Array(raw);
  return new Uint8Array(raw);
}

const accessors = gltfJson.accessors;
const mesh = gltfJson.meshes[0];
const prim = mesh.primitives[0];

const positions = getAccessorData(accessors, prim.attributes.POSITION);
const normals = getAccessorData(accessors, prim.attributes.NORMAL);
const uvs = getAccessorData(accessors, prim.attributes.TEXCOORD_0);
const indices = getAccessorData(accessors, prim.indices);

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
geometry.setIndex(new THREE.BufferAttribute(indices, 1));

// Decode texture
const imgBv = gltfJson.images[0].bufferView;
const imgData = getBufferView(imgBv);
const blob = new Blob([imgData], { type: 'image/png' });
const url = URL.createObjectURL(blob);
const texture = new THREE.TextureLoader().load(url);

const material = new THREE.MeshStandardMaterial({
  map: texture,
  metalness: 0,
  roughness: 0.5,
  side: THREE.DoubleSide
});

const obj = new THREE.Mesh(geometry, material);
// Apply the node rotation from gltf (quaternion)
const nodeRot = gltfJson.nodes[0].rotation;
if (nodeRot) {
  const q = new THREE.Quaternion(nodeRot[0], nodeRot[1], nodeRot[2], nodeRot[3]);
  obj.setRotationFromQuaternion(q);
}
scene.add(obj);

function animate() {
  requestAnimationFrame(animate);
  obj.rotation.y += 0.01;
  renderer.render(scene, camera);
}
animate();
